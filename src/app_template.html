<title>Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout : coquille d'application. Barre du haut (marque, parcours, réglages) + onglets, qui passent en barre fixe en bas sur téléphone. En série : question à gauche, note et grille de progression à droite. Violet = ta réponse, vert = clé. */
:root{
  --bg:#f8f5fc; --surface:#ffffff; --sunken:#f1ecf7; --bar:#ffffff; --ink:#2a2535; --muted:#6c6680; --line:#e7e0f0;
  --accent:#5b3fc4; --accent-ink:#ffffff; --accent-soft:#ece7fb;
  --navy:#1d2c5e; --navy-ink:#ffffff; --navy-soft:#e4e9f5; --head:#1d2c5e;
  --ok:#1c8150; --ok-soft:#e2f3ea; --bad:#c23b31; --bad-soft:#fbe6e3; --warn:#c07a0a; --warn-soft:#fbf0dc; --on-sem:#ffffff;
  --display:"Source Sans 3",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"Source Sans 3",system-ui,sans-serif;
  --r:18px; --shadow:0 2px 10px rgba(110,80,40,.07); --sun:#e2537e; --sun-soft:#fde3ec; --mint:#2fa57e; --mint-soft:#dcf4ea; --sky-soft:#dfeafc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0e0d12; --sunken:#17151d; --bar:#000000; --ink:#efebf6; --muted:#aaa3bb; --line:#26232f; --sun:#f07ea0; --sun-soft:#3a2230; --mint:#5cc9a0; --mint-soft:#183129; --sky-soft:#1b2540;
  --accent:#a993f5; --accent-ink:#14121c; --accent-soft:#2a2342;
  --navy:#9fb3ec; --navy-ink:#0f0f15; --navy-soft:#1a2240; --head:#e3e8f8;
  --ok:#43c286; --ok-soft:#15291f; --bad:#ef7a6f; --bad-soft:#36191a; --warn:#e9a93f; --warn-soft:#33261a; --on-sem:#0f0f15; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0e0d12; --sunken:#17151d; --bar:#000000; --ink:#efebf6; --muted:#aaa3bb; --line:#26232f; --sun:#f07ea0; --sun-soft:#3a2230; --mint:#5cc9a0; --mint-soft:#183129; --sky-soft:#1b2540;
  --accent:#a993f5; --accent-ink:#14121c; --accent-soft:#2a2342;
  --navy:#9fb3ec; --navy-ink:#0f0f15; --navy-soft:#1a2240; --head:#e3e8f8;
  --ok:#43c286; --ok-soft:#15291f; --bad:#ef7a6f; --bad-soft:#36191a; --warn:#e9a93f; --warn-soft:#33261a; --on-sem:#0f0f15; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--navy)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:none}
.brand b{color:var(--head);font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap}
.brand>span{min-width:0;overflow:hidden}
.brand b{display:block;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parsel{font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);background-color:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:7px 30px 7px 14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer;width:auto;max-width:46vw;flex:none}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);text-decoration:none;flex:none}
.iconbtn[aria-current="page"]{color:var(--navy);border-color:var(--navy)}
nav#tabs{display:flex;gap:4px;margin-bottom:-1px}
nav#tabs a{display:flex;align-items:center;gap:7px;padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
nav#tabs a:hover{color:var(--ink)}
nav#tabs a[aria-current="page"]{color:var(--head);border-color:var(--navy)}
nav#tabs svg,.iconbtn svg{width:18px;height:18px;flex:none}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:30px 72px}
h1,h2{color:var(--head);font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.75rem,4.2vw,2.6rem);font-weight:800;line-height:1.08}
h2{font-size:1.55rem;font-weight:800;line-height:1.15}
h3{font-family:var(--display);font-size:1.05rem;font-weight:700;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--navy);margin:0 0 10px}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:22px}
.head>div{min-width:0}
.section{margin-top:44px}
.section>.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.section>.sh p{margin:0;color:var(--muted);font-size:.88rem}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;font-weight:600;font-size:.92rem}
button:hover:not(:disabled){border-color:var(--muted)}
button.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
button.primary:hover:not(:disabled){filter:brightness(1.12);border-color:var(--navy)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
button.ghost:hover:not(:disabled){color:var(--ink);border-color:transparent}
button.danger{background:var(--bad);border-color:var(--bad);color:var(--on-sem)}
button.wide{width:100%}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.resume{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);background:var(--navy-soft);border:1px solid var(--navy);margin-bottom:24px}
.resume .t{flex:1 1 220px;min-width:0}
.resume .t b{display:block;color:var(--navy)}
.resume .t span{font-size:.86rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 170px}
.field label,.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
select,input[type=number],input[type=email],input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.track{height:7px;background:var(--sunken);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--navy);border-radius:4px}
/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start}
.hero .lead{color:var(--muted);font-size:1.03rem;max-width:56ch;margin:14px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin:22px 0 0;padding:0;list-style:none}
.facts li{display:flex;flex-direction:column}
.facts b{font-family:var(--mono);font-size:1.45rem;font-weight:600;line-height:1.1}
.facts span{font-size:.8rem;color:var(--muted)}
.cta{margin-top:24px}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hero .seg{margin-top:20px}
.me h3{margin-bottom:12px}
.me .big{display:flex;align-items:baseline;gap:6px}
.me .big b{font-family:var(--mono);font-size:2.1rem;font-weight:600;line-height:1}
.me .track{margin:12px 0 16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--sunken);border-radius:10px;padding:10px 12px}
.kv b{display:block;font-family:var(--mono);font-size:1.25rem;font-weight:600}
.kv span{font-size:.78rem;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-top:14px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.mats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mat{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:400}
.mat:hover:not(:disabled){border-color:var(--navy)}
.mat h3{font-size:1rem}
.mat .meta{font-size:.82rem;color:var(--muted)}
.mat .foot{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:auto}
.sess{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sess button{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(80px,160px);gap:16px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 18px;font-weight:400;background:transparent}
.sess button:last-child{border-bottom:0}
.sess button:hover{background:var(--sunken)}
.sess b{font-weight:600}
.legend{display:grid;gap:14px 24px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:0}
.legend div{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.legend dd{margin:0;color:var(--muted);font-size:.88rem}
.bareme{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap;line-height:1.4}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
/* annales / entraînement */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.filters .go{flex:0 0 auto}
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.modebar .lbl{margin:0}
.modebar.plain{margin:0;padding:0;border:0}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 4px}
.jl{font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--navy);border:1px solid var(--line)}
.jl:hover:not(:disabled){border-color:var(--navy)}
.block{margin-top:30px;scroll-margin-top:150px}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--navy-soft)}
.bh h3{font-size:1.3rem;color:var(--head)}
.bh .meta{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.pill{font-size:.8rem;font-weight:600;background:var(--navy-soft);color:var(--navy);border-radius:999px;padding:4px 12px}
.mods{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.mod.open{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mh .num{white-space:nowrap}
.mod.bonus{border-style:dashed;border-color:var(--accent);box-shadow:none;background:var(--accent-soft)}
.warnbox{margin:18px 0 0;padding:12px 16px;border-radius:12px;background:var(--warn-soft);font-size:.9rem}
.warnbox b{color:var(--warn)}
.mname{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--navy);letter-spacing:-.01em}
.mname.long{font-size:1.08rem}
.yrs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.msub{margin:0;color:var(--muted);font-size:.85rem;line-height:1.4}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
button.sm{padding:7px 12px;font-size:.84rem}
.openlist{margin-top:12px}
.chlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) 80px minmax(80px,160px) 56px 16px;gap:16px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:13px 18px;font-weight:400}
.chrow:last-child{border-bottom:0}
.chrow:hover{background:var(--sunken)}
.chrow .cname{font-weight:500;min-width:0}
.chrow .cn,.chrow .cm{font-size:.84rem;color:var(--muted);text-align:right}
.chrow .go{color:var(--navy);font-size:1.3rem;line-height:1}
.modebar small{color:var(--muted);font-size:.82rem}
.count{font-size:.88rem;color:var(--muted);margin:18px 0 8px}
.group{margin-top:18px}
.group h4{display:flex;justify-content:space-between;gap:10px;font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:0 0 8px}
.qlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.qrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px 18px;font-weight:400}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--sunken)}
.qrow .qn{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.qrow .qt{min-width:0}
.qrow .qt b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .qt small{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .qs{display:flex;align-items:center;gap:10px}
.score{font-family:var(--mono);font-size:.85rem;font-weight:600;min-width:34px;text-align:right}
.score.s1{color:var(--ok)}.score.sp{color:var(--warn)}.score.s0{color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--surface);font-size:.88rem;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:600}
.opt span.n{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.opt:has(input:checked) span.n{color:var(--navy)}
.steps{display:flex;flex-direction:column;gap:22px}
.steps .lbl{display:block;margin-bottom:10px}
/* série */
.runhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.runhead .t{font-size:.88rem;color:var(--muted)}
.runwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.chead .where{color:var(--muted);font-size:.9rem;min-width:0}
.ref{font-family:var(--mono);font-size:.78rem;font-weight:600;background:var(--navy-soft);color:var(--navy);border-radius:999px;padding:4px 11px;white-space:nowrap}
.qnum{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.98rem;margin:0 0 6px}
.stem{font-size:1.15rem;margin:0 0 10px;max-width:72ch;line-height:1.5;font-weight:500;white-space:pre-line}
.qinfo{color:var(--muted);font-size:.88rem;margin:0 0 18px}
.items{display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:34px 34px 1fr;gap:10px;padding:0 17px;font-size:.7rem;font-weight:600;letter-spacing:.09em;color:var(--muted);margin-bottom:-2px}
.cols span{text-align:center}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:start;text-align:left;padding:13px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:100%;font-weight:400;font-size:1rem;color:var(--ink)}
button.item:hover:not(:disabled){border-color:var(--accent)}
.item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.L{font-family:var(--mono);font-weight:600;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);background:var(--surface);font-size:.9rem}
.item[aria-pressed="true"] .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item .txt{padding-top:5px;min-width:0}
.orignote{margin:8px 0 0;font-size:.85rem}
.item.corr{grid-template-columns:34px 34px minmax(0,1fr) 24px;gap:10px}
.item.corr.miss{border-color:var(--bad);background:var(--bad-soft)}
.L.toi.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.L.cle{border-style:dashed}
.L.cle.on{background:var(--ok);border:1.5px solid var(--ok);color:var(--on-sem)}
.mk{padding-top:6px;display:grid;place-items:center}
.mk svg{width:20px;height:20px}
.mk.y{color:var(--ok)}.mk.n{color:var(--bad)}
.ex{font-size:.9rem;color:var(--muted);margin-top:6px}
.ex b{color:var(--ink)}
.disc{display:flex;align-items:center;gap:18px;margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--sunken)}
.disc .pts{white-space:nowrap;font-family:var(--mono);font-size:2.1rem;font-weight:600;line-height:1;min-width:52px}
.disc .pts small{font-size:.85rem;color:var(--muted);margin-left:2px;font-family:var(--body)}
.disc.s1 .pts{color:var(--ok)}.disc.sp .pts{color:var(--warn)}.disc.s0 .pts{color:var(--bad)}
.disc b{display:block;margin-bottom:8px}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.scale span{font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--muted)}
.scale span.on{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.notice{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:.89rem}
.notice b{color:var(--warn)}
.notice.ok{background:var(--ok-soft)}.notice.ok b{color:var(--ok)}
.notice.bad{background:var(--bad-soft)}.notice.bad b{color:var(--bad)}
.notice.acc{background:var(--accent-soft)}.notice.acc b{color:var(--accent)}
.notice.neutral{background:var(--sunken)}.notice.neutral b{color:var(--ink)}
.notice .src{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}

<script>
const Q=JSON.parse(document.getElementById('data').textContent);
const BYID=Object.fromEntries(Q.map(q=>[q.id,q]));
const LASBIO=['Physiologie','Initiation aux médicaments','Santé publique','Découverte des métiers'];
const PARCOURS=[
 {id:'pass',nom:'PASS',long:'PASS majeure santé',ok:true},
 {id:'lasbio',nom:'L.AS bio',long:'L.AS bio',ok:true},
 {id:'lashb',nom:'L.AS hors-bio',long:'L.AS hors-bio',ok:true}];
const HB=JSON.parse(document.getElementById('hb').textContent),HBSET=new Set(Object.values(HB).flat());
const cmp=(a,b)=>a.localeCompare(b,'fr',{numeric:true});
const inP=q=>state.parcours==='lashb'?HBSET.has(q.id):q.par?q.par.includes(state.parcours):(state.parcours==='lasbio'?LASBIO.includes(q.mat):true);
const QP=()=>Q.filter(inP);
const MATSP=()=>[...new Set(QP().map(q=>q.mat))].sort((a,b)=>matSort(a,b));
Q.forEach(q=>{if(!q.sk){q.sk='dec'+q.y;q.sl='Déc. '+q.y}});
const SESS=()=>{const m=new Map();QP().forEach(q=>m.set(q.sk,[q.gl||q.sl,q.sk==='paces'?0:q.y]));return [...m.entries()].sort((x,y)=>y[1][1]-x[1][1]).map(([k,v])=>[k,v[0]])};
const LASS=JSON.parse(document.getElementById('lass').textContent);
function SG(){const QQ=QP();
  const fromSk=(k,l,note)=>{const qs=QQ.filter(q=>q.sk===k);return {k,l,note,num:false,y:k.startsWith('dec')?+k.slice(3):0,las:false,mods:[...new Set(qs.map(q=>q.mod))].sort().map(md=>({md,qs:qs.filter(q=>q.mod===md).sort((x,y)=>y.y-x.y||x.q-y.q)}))}};
  if(state.parcours==='lashb')return Object.keys(HB).sort((a,b)=>b-a).map(y=>{const qs=HB[y].map(id=>BYID[id]).filter(Boolean);const HBO=['Découverte des métiers','Santé publique','Biologie cellulaire','Histologie','Biologie de la reproduction','Génétique','Chimie organique','Biochimie','Biophysique (BAME)','Biophysique (BMI)','Physiologie','Initiation aux médicaments'];const mats=HBO.filter(m=>qs.some(q=>q.mat===m));
    return {k:'dec'+y,l:'Déc. '+y,y:+y,num:true,note:'sujet officiel L.AS hors-bio',all:qs,mods:mats.map(m=>({md:m,qs:qs.filter(q=>q.mat===m)}))}});
  if(state.parcours!=='lasbio')return SESS().map(([k,l])=>fromSk(k,l,''));
  return SESS().filter(([k])=>k.startsWith('dec')).map(([k,l])=>{const y=+k.slice(3),L=LASS.find(g=>g.y===y);
    if(L){const qs=L.ids.map(id=>BYID[id]).filter(Boolean);const mods=LASBIO.filter(m=>qs.some(q=>q.mat===m)).map(m=>({md:m,qs:qs.filter(q=>q.mat===m)}));
      if(L.bonus.length)mods.push({md:'Bonus métiers',qs:L.bonus.map(id=>BYID[id]).filter(Boolean),bonus:true});
      return {k,l,y,num:true,note:'sujet officiel L.AS bio'+(L.note?' · '+L.note:''),mods,all:qs}}
    const qs=QQ.filter(q=>q.sk===k);
    return {k,l,y,num:true,warn:y<=2021,note:y<=2021?'basée sur le sujet PASS':'',mods:LASBIO.filter(m=>qs.some(q=>q.mat===m)).map(m=>({md:m,qs:qs.filter(q=>q.mat===m).sort((x,y)=>x.mod.localeCompare(y.mod)||x.q-y.q)}))}});}

const MODS=()=>[...new Set(QP().map(q=>q.mod))].sort();
const DEF_STATE=()=>({parcours:'pass',ans:{},mode:'direct',fav:{},notes:{},srs:{},chrono:false});
let state=DEF_STATE(), run=null, view='accueil', saveTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const untag=s=>String(s).replace(/<\/?(sub|sup|i|u)>/g,'');
const rt=s=>esc(s).replace(/&lt;(\/?)(sub|sup|i|u)&gt;/g,'<$1$2>');
const fr=n=>String(n).replace('.',',');
const sCls=s=>s===1?'s1':s>0?'sp':'s0';
const isU=q=>q.type==='QRU'||q.type==='QCS';
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2400)}
function discord(q,sel){const s=new Set(sel),a=new Set(q.ans.split(''));let err=0;for(const it of q.items){if(s.has(it.l)!==a.has(it.l))err++}return err}
function score(q,sel){const err=discord(q,sel);if(isU(q))return err===0?1:0;return err===0?1:err===1?.8:err===2?.25:0}
function sess(q){return q.sl||('Déc. '+q.y)}
function chips(q){if(q.annul)return '<span class="chip warn">Annulée</span>';const s=q.status;
  if(s.startsWith('À vérifier'))return '<span class="chip warn">À vérifier</span>';
  if(s.startsWith('Rectif'))return '<span class="chip bad">Rectifiée</span>';
  if(s.startsWith('Validée'))return '<span class="chip ok">Vérifiée</span>';
  if(s.startsWith('Incertaine'))return '<span class="chip warn">Incertaine</span>';
  if(s.startsWith('Maintenue')||s.startsWith('Confirmée'))return '<span class="chip ok">Confirmée par le cours</span>';
  if(s.includes('seule source'))return '<span class="chip acc">Source unique</span>';
  if(s.startsWith('Cours'))return '<span class="chip acc">Corrigée sur le cours</span>';
  return '<span class="chip plain">Non comparée</span>'}
const ICON={y:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',n:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'};
const DAY=864e5,IV=[1,3,7];
function migrateSrs(){for(const [id,a] of Object.entries(state.ans||{}))if(a&&a.s<1&&!state.srs[id])state.srs[id]={st:0,due:(a.t||Date.now())+DAY}}
function srsUpdate(id,s){const r=state.srs[id];if(s<1)state.srs[id]={st:0,due:Date.now()+DAY};else if(r){const st=r.st+1;if(st>=IV.length)delete state.srs[id];else state.srs[id]={st,due:Date.now()+IV[st]*DAY}}}
function dueQs(){const now=Date.now();return Object.entries(state.srs).filter(([id,r])=>r.due<=now&&BYID[id]&&inP(BYID[id])).sort((a,b)=>a[1].due-b[1].due).map(([id])=>BYID[id])}
function soonQs(){const now=Date.now();return Object.entries(state.srs).filter(([id,r])=>r.due>now&&BYID[id]&&inP(BYID[id])).length}
function favQs(){return Object.keys(state.fav).filter(id=>BYID[id]&&inP(BYID[id])).map(id=>BYID[id]).sort((a,b)=>cmp(a.mat,b.mat)||b.y-a.y||a.q-b.q)}

  $('#fav').onclick=e=>{if(state.fav[q.id])delete state.fav[q.id];else state.fav[q.id]=1;e.currentTarget.setAttribute('aria-pressed',!!state.fav[q.id]);toast(state.fav[q.id]?'Ajoutée aux favorites':'Retirée des favorites');persist()};
  let nt;$('#note').oninput=e=>{clearTimeout(nt);const v=e.target.value;nt=setTimeout(()=>{if(v.trim())state.notes[q.id]=v;else delete state.notes[q.id];persist()},600)};

  $('#prev').onclick=()=>goTo(run.i-1);
  if($('#next'))$('#next').onclick=next;if($('#val'))$('#val').onclick=validate;if($('#skip'))$('#skip').onclick=()=>goTo(run.i+1<run.ids.length?run.i+1:run.i);if($('#fin'))$('#fin').onclick=askFinish;
}
function openReport(q){const box=$('#rep');if(box.innerHTML){box.innerHTML='';return}box.innerHTML=`<form id="repF"><div class="field"><label for="repI">Où est l'erreur ?</label><select id="repI"><option>Énoncé</option>${q.items.map(i=>`<option>Proposition ${i.l}</option>`).join('')}<option>Correction en général</option></select></div><div class="field"><label for="repM">Explique en une phrase</label><textarea id="repM" rows="2" required></textarea></div><div class="row"><button class="primary sm" type="submit">Envoyer</button><button class="ghost sm" type="button" id="repX">Annuler</button></div></form>`;
  $('#repX').onclick=()=>{box.innerHTML=''};
  $('#repF').onsubmit=async e=>{e.preventDefault();const msg=$('#repM').value.trim();if(!msg)return;const item=$('#repI').value;
    const ref=sess(q)+' · '+q.mod+' · Q'+q.q;
    try{await sendReport(q.id,item+' : '+msg.slice(0,1000));box.innerHTML='<p class="muted" style="font-size:.88rem;margin:0">Merci, signalement envoyé.</p>';toast('Signalement envoyé')}
    catch(err){const txt=`Erreur signalée : ${ref} (${q.mat}) · ${item} · ${msg}`;box.innerHTML=`<div class="notice neutral"><b>Envoi impossible pour le moment</b> (hors ligne ?). Réessaie plus tard, ou copie ce message et envoie-le à l'équipe Atlas${CONFIG.CONTACT_EMAIL?' ('+esc(CONFIG.CONTACT_EMAIL)+')':''} :<textarea readonly rows="3" style="margin-top:8px" id="repT">${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button class="sm" id="repC">Copier</button></div></div>`;
      $('#repC').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Copié')}catch(_){const t=$('#repT');t.focus();t.select()}}}}}
function actionWord(q,shown){if(run.mode==='fin'&&!run.done)return run.i===run.ids.length-1?'terminer':'suivante';return shown||q.annul?'suivante':'valider'}
function drawSide(){const s=$('#side');if(!s)return;
  const n=run.ids.length,nd=Object.keys(run.res).length,ansd=run.ids.filter(id=>run.sel[id]).length,ns=noteSerie(),fin=run.mode==='fin'&&!run.done;
  const left=run.limit-(run.el||0),tm=run.chrono&&!(run.mode==='fin'&&run.done)?`<div class="${left<=run.limit*.1?'low':''}"><b id="timer">${fmtT(left)}</b><span>temps restant</span></div>`:'';
  const k1=fin?`<div><b>${ansd}<small style="font-size:.8rem;color:var(--muted)"> / ${n}</small></b><span>répondues</span></div>`:`<div><b>${ns==null?'–':fr(ns.toFixed(1))}<small style="font-size:.8rem;color:var(--muted)"> /20</small></b><span>${nd} / ${n} corrigée${nd>1?'s':''}</span></div>`;
  s.innerHTML=`<div class="panel sidep"><div class="kpis">${k1}${tm||`<div><b>${run.i+1}</b><span>question sur ${n}</span></div>`}</div>
    ${fin?`<button class="primary wide" id="sfin">Terminer et corriger</button><div id="conf"></div>`:(run.done||nd)?`<button class="wide" id="ssum">Voir le bilan</button>`:''}
    <div class="grid">${run.ids.map((id,i)=>{const q=BYID[id];let c='';
    if(q.annul)c='nul';else if(id in run.res)c=sCls(run.res[id]);else if(run.sel[id])c='ans';
    return `<button class="cell ${c} ${i===run.i&&!run.summary?'cur':''}" data-i="${i}" title="Question ${i+1}">${i+1}</button>`}).join('')}</div></div>`;
  s.querySelectorAll('.cell').forEach(b=>b.onclick=()=>goTo(+b.dataset.i));
  if($('#sfin'))$('#sfin').onclick=askFinish;if($('#ssum'))$('#ssum').onclick=()=>{run.summary=true;drawMain();drawSide();window.scrollTo(0,0)};
  if(run.confirm)showConfirm();
  const cur=s.querySelector('.cell.cur');if(cur){const g=cur.parentElement;if(cur.offsetTop<g.scrollTop||cur.offsetTop>g.scrollTop+g.clientHeight-40)g.scrollTop=cur.offsetTop-g.clientHeight/2}
}
function goTo(i){if(i<0||i>=run.ids.length)return;run.i=i;run.summary=false;saveRun();drawMain();drawSide();window.scrollTo(0,0)}
function toggle(L){if(!run||run.summary)return;const q=curQ();if(q.annul||isShown(q.id))return;
  let s=run.sel[q.id]||'';if(isU(q))s=s===L?'':L;else s=s.includes(L)?s.replace(L,''):[...s+L].sort().join('');
  if(s)run.sel[q.id]=s;else delete run.sel[q.id];saveRun();drawMain();drawSide()}
function record(q,sel,s){state.ans[q.id]={s,sel,t:Date.now(),n:((state.ans[q.id]||{}).n||0)+1};srsUpdate(q.id,s)}
function validate(){const q=curQ(),sel=run.sel[q.id]||'';if(!sel)return;const s=score(q,sel);run.res[q.id]=s;record(q,sel,s);saveRun();drawMain();drawSide()}
function next(){if(run.mode==='fin'&&!run.done){goTo(Math.min(run.i+1,run.ids.length-1));return}
  if(run.i<run.ids.length-1)goTo(run.i+1);else{run.summary=true;drawMain();drawSide();window.scrollTo(0,0)}}
function askFinish(){const miss=run.ids.filter(id=>!BYID[id].annul&&!run.sel[id]).length;if(!miss){finish();return}run.confirm=true;drawSide();const c=$('#conf');if(c)c.scrollIntoView({block:'nearest'})}
function showConfirm(){const c=$('#conf');if(!c)return;const miss=run.ids.filter(id=>!BYID[id].annul&&!run.sel[id]).length;
  c.innerHTML=`<div class="confirm"><p>${miss} question${miss>1?'s':''} sans réponse ${miss>1?'compteront':'comptera'} 0. Corriger quand même ?</p><div class="row"><button class="primary" id="cy">Corriger</button><button id="cn">Continuer</button></div></div>`;
  $('#cy').onclick=finish;$('#cn').onclick=()=>{run.confirm=false;drawSide()}}
function finish(){run.confirm=false;for(const id of run.ids){const q=BYID[id];if(q.annul)continue;const sel=run.sel[id]||'';const s=sel?score(q,sel):0;run.res[id]=s;record(q,sel,s)}
  run.done=true;run.summary=true;saveRun();vQuiz($('#view'));window.scrollTo(0,0)}
function summaryHTML(){const ids=run.ids.filter(id=>id in run.res),v=ids.map(id=>run.res[id]),ns=noteSerie();
  const juste=v.filter(x=>x===1).length,part=v.filter(x=>x>0&&x<1).length,blank=ids.filter(id=>run.res[id]===0&&!run.sel[id]).length,faux=v.filter(x=>x===0).length-blank;
  const firstErr=run.ids.findIndex(id=>id in run.res&&run.res[id]<1);
  return `<article class="card"><p class="eyebrow">Bilan de la série</p><div class="big20">${ns==null?'–':fr(ns.toFixed(1))}<small> /20</small></div>
   
   ${run.el?`<p class="muted" style="margin:8px 0 0">Temps : ${fmtDur(run.el)} · ${fmtDur(run.el/Math.max(1,ids.length))} par question${run.chrono?' (limite '+fmtDur(run.limit)+')':''}</p>`:''}
   <div class="sumgrid"><div><b style="color:var(--ok)">${juste}</b><span>justes</span></div><div><b style="color:var(--warn)">${part}</b><span>partielles</span></div><div><b style="color:var(--bad)">${faux}</b><span>fausses</span></div><div><b>${blank}</b><span>sans réponse</span></div></div>
   <div class="row"><button class="primary" id="rv">Voir la correction</button>${firstErr>=0?'<button id="re">Aller à ma première erreur</button>':''}<button class="ghost" id="rb">Retour</button></div></article>`}
function bindSummary(){$('#rv').onclick=()=>goTo(0);if($('#re'))$('#re').onclick=()=>goTo(run.ids.findIndex(id=>id in run.res&&run.res[id]<1));$('#rb').onclick=leaveRun}
// Zoom sur l'énoncé scanné : un toucher ouvre l'image en grand, boutons − / + pour zoomer, on fait défiler pour lire.
(function(){const Z=[100,160,230,320];let zi=0,box=null;
  const apply=()=>{const o=box.querySelector('.orig');o.style.width=Z[zi]+'%';box.querySelector('.zl').textContent=Z[zi]+' %'};
  const close=()=>{if(!box)return;box.remove();box=null;document.body.style.overflow=''};
  document.addEventListener('click',e=>{const src=e.target.closest('.orig');if(!src||src.closest('#zoomv'))return;
    box=document.createElement('div');box.id='zoomv';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Énoncé agrandi');
    box.innerHTML='<div class="zbar"><span class="zl"></span><button type="button" data-z="-1" aria-label="Réduire">−</button><button type="button" data-z="1" aria-label="Agrandir">+</button><button type="button" class="zx">Fermer</button></div><div class="zscroll"></div>';
    const c=src.cloneNode(true);c.querySelectorAll('img').forEach(i=>i.loading='eager');box.querySelector('.zscroll').appendChild(c);
    zi=innerWidth<700?1:0;document.body.appendChild(box);document.body.style.overflow='hidden';apply();
    box.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{zi=Math.max(0,Math.min(Z.length-1,zi+ +b.dataset.z));apply()});
    box.querySelector('.zx').onclick=close;box.onclick=ev=>{if(ev.target===box||ev.target.classList.contains('zscroll'))close()};box.querySelector('.zx').focus()});
  document.addEventListener('keydown',e=>{if(box&&e.key==='Escape'){e.stopImmediatePropagation();close()}},true)})();
document.addEventListener('keydown',e=>{if(view!=='quiz'||!run||run.summary||e.metaKey||e.ctrlKey||e.altKey)return;if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName))return;
  const q=curQ(),k=e.key.toUpperCase();
  if(k.length===1&&'ABCDE'.includes(k)&&q.items.some(i=>i.l===k)){e.preventDefault();toggle(k)}
  else if(e.key==='ArrowRight'){goTo(run.i+1)}else if(e.key==='ArrowLeft'){goTo(run.i-1)}
  else if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();
    if(run.mode==='fin'&&!run.done){run.i===run.ids.length-1?askFinish():next()}else if(isShown(q.id)||q.annul)next();else validate()}});
function resultHTML(q,sel){const err=discord(q,sel),s=sel?score(q,sel):0,blank=!sel;
  const title=blank?'Sans réponse':err===0?'Aucune discordance':err+' discordance'+(err>1?'s':'');
  const scale=isU(q)?[['Juste → 1',err===0],['Faux → 0',err>0]]:[['0 → 1',err===0],['1 → 0,8',err===1],['2 → 0,25',err===2],['3+ → 0',err>=3]];
  let h=`<div class="disc ${sCls(s)}"><div class="pts">${fr(s)}<small>pt</small></div><div><b>${title}</b><div class="scale">${scale.map(([t,on])=>`<span class="${on&&!blank?'on':''}">${t}</span>`).join('')}</div></div></div>`;
  const st=q.status;
  if(st.startsWith('Rectif'))h+=`<div class="notice bad"><b>Correction rectifiée.</b> La première correction donnait <span class="num">${q.orig}</span>. ${esc(q.note)}<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Incertaine'))h+=`<div class="notice"><b>Correction incertaine.</b> Le cours ne permet pas de trancher : c'est la première correction qui est retenue. ${esc(q.note||'')}</div>`;
  else if(st.includes('seule source'))h+=`<div class="notice acc"><b>Source unique.</b> Il n'existe qu'une correction pour cette question : elle n'a pas pu être recoupée.<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Confirmée'))h+=`<div class="notice ok"><b>Confirmée par le cours.</b> Les explications s'appuient sur le cours.<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Maintenue'))h+=`<div class="notice ok"><b>Confirmée par le cours.</b> ${esc(q.note)}<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Validée'))h+=`<div class="notice ok"><b>Correction vérifiée.</b> Deux corrections indépendantes donnent la même réponse.</div>`;
  else if(st.startsWith('À vérifier (désaccord'))h+=`<div class="notice"><b>À vérifier.</b> Le cours semble contredire la correction : la réponse affichée n'est pas encore tranchée. ${esc(q.note||'')}${q.src?`<span class="src">Source : ${esc(q.src)}</span>`:''}</div>`;
  else if(st.startsWith('À vérifier (cohérence)'))h+=`<div class="notice"><b>À vérifier.</b> Les données de cette correction se contredisent : la réponse affichée n'est pas encore tranchée. ${esc(q.note||'')}${q.src?`<span class="src">Source : ${esc(q.src)}</span>`:''}</div>`;
  else if(st.startsWith('À vérifier (conn')||st.startsWith('À vérifier (calc'))h+=`<div class="notice"><b>À vérifier.</b> La réponse affichée est peut-être fausse : elle n'est pas encore tranchée. ${esc(q.note||'')}</div>`;
  else if(st.startsWith('À vérifier'))h+=`<div class="notice"><b>À vérifier.</b> Pas encore de correction pour ce sujet : correction faite à partir des cours. ${esc(q.note||'')}<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Cours (sans'))h+=`<div class="notice acc"><b>Corrigée sur le cours.</b> Pas encore de correction pour ce sujet : correction faite à partir des cours.<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Cours'))h+=`<div class="notice acc"><b>Corrigée sur le cours.</b> Cette question n'existe qu'en L.AS : il n'y a pas de première correction, la correction a été faite à partir du cours.${st.includes('confirmer')&&q.note?' '+esc(q.note):''}<span class="src">Source : ${esc(q.src)}</span></div>`;
  else if(st.startsWith('Non comparée'))h+=`<div class="notice neutral"><b>Correction non comparée.</b> Pas de seconde correction disponible pour ce sujet.</div>`;

  if(typeof isAdmin==='function'&&isAdmin())h+=`<div class="row" style="margin-top:10px"><button class="sm ghost" data-editq="${esc(q.id)}">Modifier la correction</button></div>`;
  return h}

const imgCache={};
function loadImg(src){return imgCache[src]||(imgCache[src]=new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src}))}
async function cropData(pg,t,b){const im=await loadImg('pages/'+pg+'.jpg');const sc=im.naturalWidth/1000;const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=Math.max(1,Math.round((b-t)*sc));c.getContext('2d').drawImage(im,0,Math.round(t*sc),c.width,c.height,0,0,c.width,c.height);return {d:c.toDataURL('image/jpeg',.85),r:c.height/c.width}}
async function exportPDF(list,title='Carnet d\'erreurs',fname='carnet-erreurs.pdf'){
  const dl=window.claude?await claude.use('downloads'):null;
  if(!window.jspdf){toast('Le module PDF n\'a pas chargé, recharge la page');return}
  toast('Préparation du PDF…');
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth()-80,H=doc.internal.pageSize.getHeight();let y=50;
  const clean=s=>String(s||'').replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/→/g,'->').replace(/[^\x00-\xFF]/g,'');
  const line=(t,size=10,style='normal',gap=4,color=[30,30,40])=>{doc.setFont('helvetica',style);doc.setFontSize(size);doc.setTextColor(...color);for(const l of doc.splitTextToSize(clean(t),W)){if(y>H-50){doc.addPage();y=50}doc.text(l,40,y);y+=size+3}y+=gap};
  line(title+' - Atlas',16,'bold',6,[29,44,94]);line(new Date().toLocaleDateString('fr-FR')+' - '+list.length+' questions',9,'normal',14,[100,100,110]);
  let k=0;
  for(const q of list){k++;const a=state.ans[q.id],im=imgMode(q);
    line(`${k}. ${sess(q)} ${q.mod} Q${q.q} - ${q.mat} - ${q.ch}`,10,'bold',3,[29,44,94]);
    if(im&&q.crop){for(const [pg,t,b] of q.crop){try{const c=await cropData(pg,t,b);const h=W*c.r;if(y+h>H-40){doc.addPage();y=50}doc.addImage(c.d,'JPEG',40,y,W,h);y+=h+6}catch(e){line('(image de l\'énoncé indisponible)',8,'italic')}}}
    else line(untag(q.stem),10,'normal',3);
    for(const it of q.items)line(`${it.l}. ${im?'':untag(it.t)+'  '}[${it.v?'VRAI':'FAUX'}]${it.ex?' '+it.ex:''}`,9,'normal',2,it.v?[20,110,60]:[60,60,70]);
    line(`Ta réponse : ${a?(a.sel||'aucune')+' - note '+String(a.s).replace('.',','):'pas encore faite'}   Clé : ${q.ans}`,9,'bold',2);
    if(q.status.startsWith('Rectif'))line(`Correction rectifiée (première correction : ${q.orig}). Source : ${q.src}`,8,'italic',2);
    else if(q.status.startsWith('Incertaine'))line('Correction incertaine : première correction retenue.',8,'italic',2);
    else if(q.status.startsWith('À vérifier (désaccord'))line('À vérifier : le cours semble contredire la correction, réponse pas encore tranchée.',8,'italic',2);
    else if(q.status.startsWith('À vérifier (cohérence)'))line('À vérifier : les données de cette correction se contredisent, réponse pas encore tranchée.',8,'italic',2);
    else if(q.status.startsWith('À vérifier (conn')||q.status.startsWith('À vérifier (calc'))line('À vérifier : la réponse affichée est peut-être fausse, pas encore tranchée.',8,'italic',2);
    else if(q.status.startsWith('À vérifier'))line('À vérifier : corrigée à partir des cours, sans autre correction.',8,'italic',2);
    if(state.notes[q.id])line('Ma note : '+state.notes[q.id],9,'italic',2,[91,63,196]);
    y+=10}
  try{if(dl)await dl.save({filename:fname,data:doc.output('arraybuffer')});else doc.save(fname);toast('PDF enregistré')}
  catch(e){toast(e&&e.code==='declined'?'Export annulé':'Export impossible')}
}
